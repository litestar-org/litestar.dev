title: 'Litestar Fullstack'
description: 'A production-ready fullstack reference application with a Litestar backend and React + Vite frontend. Includes user authentication, SQLAlchemy database integration via Advanced Alchemy, background task queues, and Docker-based development.'
icon: i-lucide-user
thumbnail:
  dark: '/templates/litestar-fullstack-dark.png'
  light: '/templates/litestar-fullstack-light.png'
features:
  - title: Database integration with Advanced Alchemy
    icon: i-lucide-database
  - title: User authentication/registration and access rights
    icon: i-lucide-user
  - title: Front-end using React
    icon: i-simple-icons-react
  - title: Background task queues with SAQ
    icon: i-lucide-list-checks
  - title: Dockerized development environment
    icon: i-simple-icons-docker
links:
  - label: Preview
    to: 'https://fullstack.litestar.dev/'
    target: _blank
    leadingIcon: i-custom-litestar
    trailingIcon: i-lucide-arrow-up-right
    color: neutral
  - label: Repository
    to: 'https://github.com/litestar-org/litestar-fullstack'
    target: _blank
    leadingIcon: i-simple-icons-github
    trailingIcon: i-lucide-arrow-up-right
    color: neutral
    variant: outline
