allowBuilds:
  better-sqlite3: true
  esbuild: true
  rolldown: true
  sharp: true
  '@parcel/watcher': false
  puppeteer: false
  vue-demi: false
  # wrangler's local-dev runtime; its postinstall only downloads the workerd
  # binary, which `wrangler pages deploy` never uses.
  workerd: false
minimumReleaseAgeExclude:
  - nuxt-ai-ready@1.7.3
  - '@nuxtjs/sitemap@8.3.3'
  - nuxt@4.5.1
  - '@nuxt/kit@4.5.1'
  - '@nuxt/nitro-server@4.5.1'
  - '@nuxt/schema@4.5.1'
  - '@nuxt/vite-builder@4.5.1'
  - nuxtseo-shared@5.3.10
  - nuxt-site-config-kit@4.1.5
  - nuxt-site-config@4.1.5
  - site-config-stack@4.1.5
  - '@iconify-json/lucide@1.2.151'
  - '@j178/prek-android-arm64@0.5.10'
  - '@j178/prek-darwin-arm64@0.5.10'
  - '@j178/prek-darwin-x64@0.5.10'
  - '@j178/prek-linux-arm64-gnu@0.5.10'
  - '@j178/prek-linux-arm64-musl@0.5.10'
  - '@j178/prek-linux-x64-gnu@0.5.10'
