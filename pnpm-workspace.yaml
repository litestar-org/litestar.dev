allowBuilds:
  better-sqlite3: true
  esbuild: true
  rolldown: true
  sharp: true
  '@parcel/watcher': false
  puppeteer: false
  vue-demi: false
  # wrangler's local-dev runtime; its postinstall only downloads the workerd
  # binary, which `wrangler pages deploy` never uses.
  workerd: false
minimumReleaseAgeExclude:
  - nuxt@4.7.0
  - '@nuxt/kit@4.7.0'
  - '@nuxt/nitro-server@4.7.0'
  - '@nuxt/nitro-v3-server@4.7.0'
  - '@nuxt/schema@4.7.0'
  - '@nuxt/vite-builder@4.7.0'
  - '@nuxt/vite-server@4.7.0'
  - nitropack@2.14.0
